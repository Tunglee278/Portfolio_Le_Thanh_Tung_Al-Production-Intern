services:
  - type: web
    name: le-thanh-tung-ai-api
    runtime: docker
    plan: free
    rootDir: server
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: WHISPER_MODEL
        value: tiny
      - key: WHISPER_DEVICE
        value: cpu
      - key: WHISPER_COMPUTE_TYPE
        value: int8
      - key: MAX_UPLOAD_MB
        value: 25
      - key: MAX_MUSIC_UPLOAD_MB
        value: 25
      - key: ENABLE_GEMINI_CORRECTION
        value: false
      - key: FOOD_DB_NAME
        value: TungFoodDB
      - key: ALLOWED_ORIGINS
        sync: false
      - key: MONGO_URI
        sync: false
